<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B8A4B">
<title>O Quebra Galho</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#1f2a24;min-height:100vh}
.topo{background:#1B8A4B;color:#fff;text-align:center;padding:40px 20px 50px;border-radius:0 0 32px 32px}
.logo{width:84px;height:84px;background:#fff;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.logo svg{width:52px;height:52px}
h1{font-size:28px;letter-spacing:.5px}
.slogan{margin-top:6px;font-size:17px;opacity:.95}
.caixa{padding:22px 18px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:bold;border:2px solid #1B8A4B;margin-bottom:12px;text-align:center}
.btn.verde{background:#1B8A4B;color:#fff}
.btn.borda{background:#fff;color:#1B8A4B}
.dupla{display:flex;gap:10px;margin:6px 0 4px}
.dupla .op{flex:1;background:#f1f3f2;color:#14532d;border-radius:14px;padding:14px 8px;text-align:center;font-size:14px;font-weight:bold}
h2{font-size:18px;margin:22px 0 12px;color:#14532d}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:#f1f3f2;border-radius:14px;padding:14px 6px;text-align:center;font-size:13px;color:#14532d;font-weight:bold}
.cat span{display:block;font-size:30px;margin-bottom:6px}
.rodape{text-align:center;color:#8a948e;font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="topo">
  <div class="logo">
    <svg viewBox="0 0 64 64" fill="none" stroke="#1B8A4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 10a12 12 0 0 0-11 16L12 47a5 5 0 0 0 7 7l21-21a12 12 0 0 0 16-11l-8 8-7-2-2-7z"/>
    </svg>
  </div>
  <h1>O QUEBRA GALHO</h1>
  <div class="slogan">Encontre quem resolve!</div>
</div>

<div class="caixa">
  <div class="btn verde">ENTRAR</div>
  <div class="btn borda">CRIAR CONTA</div>

  <div class="dupla">
    <div class="op">🛠️ Sou profissional</div>
    <div class="op">🔎 Preciso contratar um serviço</div>
  </div>

  <h2>Categorias populares</h2>
  <div class="grade">
    <div class="cat"><span>🧱</span>Pedreiro</div>
    <div class="cat"><span>⚡</span>Eletricista</div>
    <div class="cat"><span>🚰</span>Encanador</div>
    <div class="cat"><span>🎨</span>Pintor</div>
    <div class="cat"><span>🪑</span>Montador de móveis</div>
    <div class="cat"><span>🚚</span>Freteiro</div>
    <div class="cat"><span>🧹</span>Diarista</div>
    <div class="cat"><span>🌿</span>Jardineiro</div>
    <div class="cat"><span>🔧</span>Mecânico</div>
  </div>
</div>

<div class="rodape">O Quebra Galho • Etapa 1 em construção</div>
</body>
</html>
